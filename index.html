<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUSLE Viewer</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        #map {
            flex: 1;
            min-width: 0;
        }

        .sidebar {
            width: 300px;
            flex: 0 0 300px;
            background: white;
            box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            padding: 20px;
        }

        h1 {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            font-size: 1em;
            color: #555;
            margin-bottom: 10px;
        }

        .properties {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            font-size: 0.9em;
        }

        .property-row {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .property-row:last-child {
            border-bottom: none;
        }

        .property-label {
            font-weight: bold;
            color: #333;
        }

        .property-value {
            color: #666;
            word-break: break-word;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .info {
            background: #e7f3ff;
            border-left: 4px solid #007bff;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #004085;
        }

        .rusle-legend {
            background: white;
            padding: 10px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
            line-height: 1.5;
            color: #333;
        }

        .rusle-legend .legend-row {
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
            font-size: 12px;
        }

        .rusle-legend .legend-swatch {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 1px solid #777;
            flex: 0 0 14px;
        }

        .timeseries-panel {
            width: min(460px, calc(100vw - 340px));
            min-width: 280px;
            padding: 12px;
            background: white;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        }

        .timeseries-chart-wrap {
            position: relative;
            height: 250px;
        }

        .timeseries-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
            color: #777;
            font-size: 0.9em;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            #map {
                height: 65%;
                flex: 0 0 65%;
            }

            .sidebar {
                width: 100%;
                height: 35%;
                max-height: 35vh;
                flex: 0 0 35%;
            }

            .timeseries-panel {
                width: min(460px, calc(100vw - 24px));
                min-width: 0;
            }

            .timeseries-chart-wrap {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="map"></div>

        <div class="sidebar">
            <h1>Erosion de suelos</h1>

            <div class="section">
                <h2>RUSLE</h2>
                <div class="properties" id="properties">
                    <p style="color: #999;">Click para ver detalles</p>
                </div>
            </div>

            <div class="section">
                <button id="zoomFit">Zoom</button>
            </div>

            <div class="info">
                <strong>Tip:</strong> Click en cualquier unidad para ver detalles
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const map = L.map('map').setView([0, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Data by &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>, under <a href="https://www.openstreetmap.org/copyright">ODbL</a>.',
            maxZoom: 19
        }).addTo(map);

        let geoJSONLayer;
        let timeSeriesChart;
        let timeSeriesEmptyMessage;

        const YEARS = Array.from({ length: 26 }, (_, index) =>
            String(2000 + index)
        );

        const RUSLE_COLORS = [
            'darkgreen',
            'forestgreen',
            'yellowgreen',
            'yellow',
            'gold',
            'orange',
            'darkorange',
            'tomato',
            'red',
            'darkred'
        ];

        let rusleMin = null;
        let rusleMax = null;
        let rusleBreaks = [];

        function getRusleValue(feature) {
            const rawValue = feature?.properties?.RUSLE;

            if (rawValue === null || rawValue === undefined || rawValue === '') {
                return null;
            }

            const value = Number(rawValue);
            return Number.isFinite(value) ? value : null;
        }

        function createRusleScale(features) {
            const values = features
                .map(feature => getRusleValue(feature))
                .filter(value => value !== null);

            if (values.length === 0) {
                rusleMin = null;
                rusleMax = null;
                rusleBreaks = [];
                return;
            }

            rusleMin = Math.min(...values);
            rusleMax = Math.max(...values);

            // Nine equally spaced breaks divide the range into ten color ranges.
            rusleBreaks = Array.from({ length: 9 }, (_, index) =>
                rusleMin + ((rusleMax - rusleMin) * (index + 1)) / 10
            );
        }

        function getRusleColor(feature) {
            const value = getRusleValue(feature);

            if (value === null || rusleMin === null) {
                return '#999999';
            }

            const colorIndex = rusleBreaks.findIndex(
                boundary => value <= boundary
            );

            return RUSLE_COLORS[colorIndex === -1 ? 9 : colorIndex];
        }

        function addRusleLegend() {
            const legend = L.control({ position: 'bottomleft' });

            legend.onAdd = function() {
                const div = L.DomUtil.create('div', 'rusle-legend');
                let html = '<strong>RUSLE</strong>';

                if (rusleMin === null) {
                    div.innerHTML = `${html}<div>No valid RUSLE values</div>`;
                    return div;
                }

                const format = value => Number(value).toPrecision(4);

                if (rusleMin === rusleMax) {
                    div.innerHTML = `
                        ${html}
                        <div class="legend-row">
                            <span class="legend-swatch"
                                  style="background: ${RUSLE_COLORS[0]}"></span>
                            <span>${format(rusleMin)} (constant)</span>
                        </div>
                    `;
                    return div;
                }

                RUSLE_COLORS.forEach((color, index) => {
                    const lower = index === 0
                        ? rusleMin
                        : rusleBreaks[index - 1];

                    const upper = index === 9
                        ? rusleMax
                        : rusleBreaks[index];

                    const rangeLabel = index === 0
                        ? `${format(lower)} – ≤ ${format(upper)}`
                        : `> ${format(lower)} – ≤ ${format(upper)}`;

                    html += `
                        <div class="legend-row">
                            <span class="legend-swatch"
                                  style="background: ${color}"></span>
                            <span>${rangeLabel}</span>
                        </div>
                    `;
                });

                div.innerHTML = html;
                L.DomEvent.disableClickPropagation(div);
                return div;
            };

            legend.addTo(map);
        }

        function addTimeSeriesPanel() {
            const panel = L.control({ position: 'bottomright' });

            panel.onAdd = function() {
                const div = L.DomUtil.create('div', 'timeseries-panel');
                const chartWrap = document.createElement('div');
                chartWrap.className = 'timeseries-chart-wrap';

                const canvas = document.createElement('canvas');
                canvas.setAttribute('aria-label', 'Annual soil loss time series');
                canvas.setAttribute('role', 'img');

                timeSeriesEmptyMessage = document.createElement('div');
                timeSeriesEmptyMessage.className = 'timeseries-empty';
                timeSeriesEmptyMessage.textContent =
                    'Selecciona una unidad para ver la serie anual';

                chartWrap.appendChild(canvas);
                chartWrap.appendChild(timeSeriesEmptyMessage);
                div.appendChild(chartWrap);

                timeSeriesChart = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: YEARS,
                        datasets: [{
                            data: YEARS.map(() => null),
                            borderColor: '#007bff',
                            backgroundColor: 'rgba(0, 123, 255, 0.15)',
                            borderWidth: 2,
                            pointRadius: 2,
                            pointHoverRadius: 5,
                            tension: 0.2,
                            spanGaps: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            title: {
                                display: false
                            },
                            tooltip: {
                                callbacks: {
                                    label: context =>
                                        ` ${context.parsed.y ?? 'Sin dato'}`
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: false
                                },
                                ticks: {
                                    autoSkip: false,
                                    minRotation: 45,
                                    maxRotation: 60,
                                    font: {
                                        size: 10
                                    }
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: 'Pérdida de suelos (Tn/ha/año)'
                                },
                                beginAtZero: true
                            }
                        }
                    }
                });

                L.DomEvent.disableClickPropagation(div);
                L.DomEvent.disableScrollPropagation(div);
                return div;
            };

            panel.addTo(map);
        }

        function getAnnualValue(properties, year) {
            const rawValue = properties?.[year];

            if (rawValue === null || rawValue === undefined || rawValue === '') {
                return null;
            }

            const value = Number(rawValue);
            return Number.isFinite(value) ? value : null;
        }

        function updateTimeSeries(feature) {
            if (!timeSeriesChart) {
                return;
            }

            const properties = feature?.properties || {};
            const values = YEARS.map(year => getAnnualValue(properties, year));

            timeSeriesChart.data.datasets[0].data = values;
            timeSeriesChart.update();

            const hasData = values.some(value => value !== null);
            timeSeriesEmptyMessage.style.display = hasData ? 'none' : 'flex';

            if (!hasData) {
                timeSeriesEmptyMessage.textContent =
                    'No hay datos anuales válidos para esta unidad';
            }
        }

        function displayProperties(feature) {
            const propertiesDiv = document.getElementById('properties');
            propertiesDiv.replaceChildren();

            const properties = feature?.properties;

            if (!properties || Object.keys(properties).length === 0) {
                const message = document.createElement('p');
                message.style.color = '#999';
                message.textContent = 'No properties';
                propertiesDiv.appendChild(message);
                return;
            }

            for (const [key, value] of Object.entries(properties)) {
                const row = document.createElement('div');
                row.className = 'property-row';

                const label = document.createElement('div');
                label.className = 'property-label';
                label.textContent = key;

                const propertyValue = document.createElement('div');
                propertyValue.className = 'property-value';
                propertyValue.textContent =
                    value !== null && value !== undefined ? String(value) : 'N/A';

                row.append(label, propertyValue);
                propertiesDiv.appendChild(row);
            }
        }

        fetch('pics/uhs_rus.geojson')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                createRusleScale(data.features || []);

                geoJSONLayer = L.geoJSON(data, {
                    style: function(feature) {
                        return {
                            color: '#3388ff',
                            weight: 2,
                            opacity: 0.8,
                            fillColor: getRusleColor(feature),
                            fillOpacity: 0.5
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        layer.on('click', function() {
                            displayProperties(feature);
                            updateTimeSeries(feature);
                        });
                    }
                }).addTo(map);

                const bounds = geoJSONLayer.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }

                addRusleLegend();
                addTimeSeriesPanel();
            })
            .catch(error => {
                console.error('Error loading RUSLE GeoJSON:', error);
                alert('No se pudo cargar pics/uhs_rus.geojson');
            });

        document.getElementById('zoomFit').addEventListener('click', function() {
            if (geoJSONLayer) {
                const bounds = geoJSONLayer.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
            }
        });
    </script>
</body>
</html>
