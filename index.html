<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUSLE Viewer</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        #map {
            flex: 1;
        }

        .sidebar {
            width: 300px;
            background: white;
            box-shadow: -2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 20px;
        }

        h1 {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            font-size: 1em;
            color: #555;
            margin-bottom: 10px;
        }

        .properties {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            font-size: 0.9em;
        }

        .property-row {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .property-row:last-child {
            border-bottom: none;
        }

        .property-label {
            font-weight: bold;
            color: #333;
        }

        .property-value {
            color: #666;
            word-break: break-word;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .info {
            background: #e7f3ff;
            border-left: 4px solid #007bff;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #004085;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: 35%;
                max-height: 35vh;
            }

            #map {
                height: 65%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Map -->
        <div id="map"></div>

        <!-- Sidebar -->
        <div class="sidebar">
            <h1>Erosion de suelos</h1>

            <!-- Feature Properties -->
            <div class="section">
                <h2>RUSLE</h2>
                <div class="properties" id="properties">
                    <p style="color: #999;">Click para ver detalles</p>
                </div>
            </div>

            <!-- Controls -->
            <div class="section">
                <button id="zoomFit">Zoom</button>
            </div>

            <div class="info">
                <strong>Tip:</strong> Click en cualquier unidad para ver detalles
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize map
        const map = L.map('map').setView([0, 0], 2);

        // Add base layer - OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: "Data by \u0026copy; \u003ca href=\"http://openstreetmap.org\"\u003eOpenStreetMap\u003c/a\u003e, under \u003ca href=\"http://www.openstreetmap.org/copyright\"\u003eODbL\u003c/a\u003e.",
            maxZoom: 19
        }).addTo(map);

        // Load GeoJSON
        let geoJSONLayer;

        fetch('pics/uhs_rus.geojson')
            .then(response => response.json())
            .then(data => {
                geoJSONLayer = L.geoJSON(data, {
                    style: {
                        color: '#3388ff',
                        weight: 2,
                        opacity: 0.8,
                        fillOpacity: 0.5
                    },
                    onEachFeature: function(feature, layer) {
                        layer.on('click', function() {
                            displayProperties(feature);
                        });
                    }
                }).addTo(map);

                // Fit map to bounds
                const bounds = geoJSONLayer.getBounds();
                map.fitBounds(bounds, { padding: [50, 50] });
            });

        // Display feature properties
        function displayProperties(feature) {
            const propertiesDiv = document.getElementById('properties');
            propertiesDiv.innerHTML = '';

            if (!feature.properties || Object.keys(feature.properties).length === 0) {
                propertiesDiv.innerHTML = '<p style="color: #999;">No properties</p>';
                return;
            }

            for (const [key, value] of Object.entries(feature.properties)) {
                const row = document.createElement('div');
                row.className = 'property-row';
                row.innerHTML = `
                    <div class="property-label">${key}</div>
                    <div class="property-value">${value !== null ? String(value) : 'N/A'}</div>
                `;
                propertiesDiv.appendChild(row);
            }
        }

        // Zoom fit button
        document.getElementById('zoomFit').addEventListener('click', function() {
            if (geoJSONLayer) {
                const bounds = geoJSONLayer.getBounds();
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        });
    </script>
</body>
</html>
